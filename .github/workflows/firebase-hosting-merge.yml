name: Deploy para produção

# Todo merge na main publica no Firebase Hosting.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - run: flutter pub get

      # Nao publica main quebrada: os testes rodam antes do deploy.
      - name: Testar
        run: flutter test

      - name: Montar env.json a partir dos secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Secret ausente chega como string vazia e o build compila liso.
          # Por isso a checagem de vazio vem ANTES de qualquer outra coisa:
          # uma versao anterior deste passo fazia `grep "$SECRET"` sem esta
          # guarda, e com o secret vazio o padrao casava com o arquivo inteiro.
          faltando=""
          for v in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_MESSAGING_SENDER_ID \
                   FIREBASE_PROJECT_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!v}" ]; then faltando="$faltando $v"; fi
          done
          if [ -n "$faltando" ]; then
            echo "::error::Secrets vazios ou ausentes no repositorio:$faltando"
            exit 1
          fi

          # jq escapa o JSON corretamente; heredoc com interpolacao quebraria
          # em qualquer valor que contivesse aspas ou barra.
          jq -n '{
            FIREBASE_API_KEY: env.FIREBASE_API_KEY,
            FIREBASE_APP_ID: env.FIREBASE_APP_ID,
            FIREBASE_MESSAGING_SENDER_ID: env.FIREBASE_MESSAGING_SENDER_ID,
            FIREBASE_PROJECT_ID: env.FIREBASE_PROJECT_ID,
            FIREBASE_AUTH_DOMAIN: env.FIREBASE_AUTH_DOMAIN,
            FIREBASE_STORAGE_BUCKET: env.FIREBASE_STORAGE_BUCKET,
            SUPABASE_URL: env.SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY: env.SUPABASE_PUBLISHABLE_KEY
          }' > env.json

      - name: Build web
        run: flutter build web --release --dart-define-from-file=env.json

      - name: Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ECOMAPBRASIL_17756 }}
          channelId: live
          projectId: ecomapbrasil-17756
