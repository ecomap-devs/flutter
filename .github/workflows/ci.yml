name: CI

# Roda em todo push e em todo PR. E o portao que impede main quebrada.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execucao antiga quando chega commit novo no mesmo branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  analise-e-testes:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Conferir formatação
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisar
        run: flutter analyze

      - name: Testar
        run: flutter test

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: analise-e-testes
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # env.json nunca entra no repositorio: e montado aqui a partir dos
      # secrets e vive so durante a execucao.
      - name: Montar env.json a partir dos secrets
        env:
          FIREBASE_API_KEY_WEB: ${{ secrets.FIREBASE_API_KEY_WEB }}
          FIREBASE_API_KEY_ANDROID: ${{ secrets.FIREBASE_API_KEY_ANDROID }}
          FIREBASE_APP_ID_WEB: ${{ secrets.FIREBASE_APP_ID_WEB }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Secret ausente chega como string vazia e o build compila liso.
          # Por isso a checagem de vazio vem ANTES de qualquer outra coisa:
          # uma versao anterior deste passo fazia `grep "$SECRET"` sem esta
          # guarda, e com o secret vazio o padrao casava com o arquivo inteiro.
          faltando=""
          for v in FIREBASE_API_KEY_WEB FIREBASE_API_KEY_ANDROID 
                   FIREBASE_APP_ID_WEB FIREBASE_APP_ID_ANDROID 
                   FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID 
                   SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!v}" ]; then faltando="$faltando $v"; fi
          done
          if [ -n "$faltando" ]; then
            echo "::error::Secrets vazios ou ausentes no repositorio:$faltando"
            exit 1
          fi

          # jq escapa o JSON corretamente; heredoc com interpolacao quebraria
          # em qualquer valor que contivesse aspas ou barra.
          jq -n '{
            FIREBASE_API_KEY_WEB: env.FIREBASE_API_KEY_WEB,
            FIREBASE_API_KEY_ANDROID: env.FIREBASE_API_KEY_ANDROID,
            FIREBASE_APP_ID_WEB: env.FIREBASE_APP_ID_WEB,
            FIREBASE_APP_ID_ANDROID: env.FIREBASE_APP_ID_ANDROID,
            FIREBASE_MESSAGING_SENDER_ID: env.FIREBASE_MESSAGING_SENDER_ID,
            FIREBASE_PROJECT_ID: env.FIREBASE_PROJECT_ID,
            FIREBASE_AUTH_DOMAIN: env.FIREBASE_AUTH_DOMAIN,
            FIREBASE_STORAGE_BUCKET: env.FIREBASE_STORAGE_BUCKET,
            SUPABASE_URL: env.SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY: env.SUPABASE_PUBLISHABLE_KEY
          }' > env.json

      - name: Build web
        run: flutter build web --release --dart-define-from-file=env.json

      # Prova que as variaveis chegaram ao bundle. O passo anterior ja garantiu
      # que nao sao vazias, entao aqui o grep tem padrao de verdade.
      - name: Conferir que as credenciais entraram no bundle
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if ! grep -q -- "$FIREBASE_PROJECT_ID" build/web/main.dart.js; then
            echo "::error::FIREBASE_PROJECT_ID nao chegou ao bundle."
            exit 1
          fi
          if ! grep -q -- "$SUPABASE_PUBLISHABLE_KEY" build/web/main.dart.js; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY nao chegou ao bundle."
            exit 1
          fi
          echo "Credenciais presentes no bundle."

  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analise-e-testes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Montar env.json a partir dos secrets
        env:
          FIREBASE_API_KEY_WEB: ${{ secrets.FIREBASE_API_KEY_WEB }}
          FIREBASE_API_KEY_ANDROID: ${{ secrets.FIREBASE_API_KEY_ANDROID }}
          FIREBASE_APP_ID_WEB: ${{ secrets.FIREBASE_APP_ID_WEB }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Secret ausente chega como string vazia e o build compila liso.
          # Por isso a checagem de vazio vem ANTES de qualquer outra coisa:
          # uma versao anterior deste passo fazia `grep "$SECRET"` sem esta
          # guarda, e com o secret vazio o padrao casava com o arquivo inteiro.
          faltando=""
          for v in FIREBASE_API_KEY_WEB FIREBASE_API_KEY_ANDROID 
                   FIREBASE_APP_ID_WEB FIREBASE_APP_ID_ANDROID 
                   FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID 
                   SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!v}" ]; then faltando="$faltando $v"; fi
          done
          if [ -n "$faltando" ]; then
            echo "::error::Secrets vazios ou ausentes no repositorio:$faltando"
            exit 1
          fi

          # jq escapa o JSON corretamente; heredoc com interpolacao quebraria
          # em qualquer valor que contivesse aspas ou barra.
          jq -n '{
            FIREBASE_API_KEY_WEB: env.FIREBASE_API_KEY_WEB,
            FIREBASE_API_KEY_ANDROID: env.FIREBASE_API_KEY_ANDROID,
            FIREBASE_APP_ID_WEB: env.FIREBASE_APP_ID_WEB,
            FIREBASE_APP_ID_ANDROID: env.FIREBASE_APP_ID_ANDROID,
            FIREBASE_MESSAGING_SENDER_ID: env.FIREBASE_MESSAGING_SENDER_ID,
            FIREBASE_PROJECT_ID: env.FIREBASE_PROJECT_ID,
            FIREBASE_AUTH_DOMAIN: env.FIREBASE_AUTH_DOMAIN,
            FIREBASE_STORAGE_BUCKET: env.FIREBASE_STORAGE_BUCKET,
            SUPABASE_URL: env.SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY: env.SUPABASE_PUBLISHABLE_KEY
          }' > env.json

      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define-from-file=env.json

      # O APK fica anexado a execucao por 14 dias — da para o grupo baixar e
      # instalar no celular sem precisar de ambiente Flutter montado.
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ecomapbrasil-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
