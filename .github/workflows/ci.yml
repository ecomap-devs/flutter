name: CI

# Roda em todo push e em todo PR. E o portao que impede main quebrada.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# O token da CI so le o repositorio. Revisao de 01/10/2026: sem esta linha,
# valia o padrao do GitHub, que pode dar escrita a qualquer codigo da CI.
permissions:
  contents: read

# As actions sao fixadas por SHA (o comentario diz a versao): uma tag pode ser
# movida para outro commit; um SHA, nao.

# Cancela execucao antiga quando chega commit novo no mesmo branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  analise-e-testes:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Conferir formatação
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisar
        run: flutter analyze

      - name: Testar
        run: flutter test

  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analise-e-testes
    # PR vindo de fork nao recebe os secrets. Antes o job falhava sempre nesse
    # caso; agora compila sem credenciais (o app abre na tela que lista o que
    # falta) e nao publica o APK.
    env:
      CONFIAVEL: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Montar env.json a partir dos secrets
        if: env.CONFIAVEL == 'true'
        env:
          FIREBASE_API_KEY_WEB: ${{ secrets.FIREBASE_API_KEY_WEB }}
          FIREBASE_API_KEY_ANDROID: ${{ secrets.FIREBASE_API_KEY_ANDROID }}
          FIREBASE_APP_ID_WEB: ${{ secrets.FIREBASE_APP_ID_WEB }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Secret ausente chega como string vazia e o build compila liso.
          # Por isso a checagem de vazio vem ANTES de qualquer outra coisa:
          # uma versao anterior deste passo fazia `grep "$SECRET"` sem esta
          # guarda, e com o secret vazio o padrao casava com o arquivo inteiro.
          faltando=""
          for v in FIREBASE_API_KEY_WEB FIREBASE_API_KEY_ANDROID FIREBASE_APP_ID_WEB FIREBASE_APP_ID_ANDROID FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!v}" ]; then faltando="$faltando $v"; fi
          done
          if [ -n "$faltando" ]; then
            echo "::error::Secrets vazios ou ausentes no repositorio:$faltando"
            exit 1
          fi

          # jq escapa o JSON corretamente; heredoc com interpolacao quebraria
          # em qualquer valor que contivesse aspas ou barra.
          jq -n '{
            FIREBASE_API_KEY_WEB: env.FIREBASE_API_KEY_WEB,
            FIREBASE_API_KEY_ANDROID: env.FIREBASE_API_KEY_ANDROID,
            FIREBASE_APP_ID_WEB: env.FIREBASE_APP_ID_WEB,
            FIREBASE_APP_ID_ANDROID: env.FIREBASE_APP_ID_ANDROID,
            FIREBASE_MESSAGING_SENDER_ID: env.FIREBASE_MESSAGING_SENDER_ID,
            FIREBASE_PROJECT_ID: env.FIREBASE_PROJECT_ID,
            FIREBASE_AUTH_DOMAIN: env.FIREBASE_AUTH_DOMAIN,
            FIREBASE_STORAGE_BUCKET: env.FIREBASE_STORAGE_BUCKET,
            SUPABASE_URL: env.SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY: env.SUPABASE_PUBLISHABLE_KEY
          }' > env.json

      - name: Build APK (debug)
        run: |
          if [ -f env.json ]; then
            flutter build apk --debug --dart-define-from-file=env.json
          else
            echo "::notice::PR de fork: APK compilado sem credenciais, e nao publicado."
            flutter build apk --debug
          fi

      # O APK fica anexado a execucao por 14 dias — da para o grupo baixar e
      # instalar no celular sem precisar de ambiente Flutter montado.
      - name: Publicar APK como artefato
        if: env.CONFIAVEL == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecomapbrasil-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # As firestore.rules valem para o app e para o site. Cada mudanca nelas passa
  # pelos testes no emulador (firestore-testes/), com os ataques da revisao de
  # 01/10/2026 como casos.
  regras:
    name: Regras do Firestore
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-testes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firestore-testes/package-lock.json

      - run: npm ci

      - name: Testar as regras no emulador
        run: npm test
