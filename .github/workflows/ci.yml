name: CI

# Roda em todo push e em todo PR. E o portao que impede main quebrada.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execucao antiga quando chega commit novo no mesmo branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  analise-e-testes:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Conferir formatação
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisar
        run: flutter analyze

      - name: Testar
        run: flutter test

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: analise-e-testes
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # env.json nunca entra no repositorio: e montado aqui a partir dos
      # secrets e vive so durante a execucao.
      - name: Montar env.json a partir dos secrets
        run: |
          cat > env.json <<'JSON'
          {
            "FIREBASE_API_KEY": "${{ secrets.FIREBASE_API_KEY }}",
            "FIREBASE_APP_ID": "${{ secrets.FIREBASE_APP_ID }}",
            "FIREBASE_MESSAGING_SENDER_ID": "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            "FIREBASE_PROJECT_ID": "${{ secrets.FIREBASE_PROJECT_ID }}",
            "FIREBASE_AUTH_DOMAIN": "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            "FIREBASE_STORAGE_BUCKET": "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          JSON

      - name: Build web
        run: flutter build web --release --dart-define-from-file=env.json

      # Prova que as variaveis chegaram no bundle. Sem isto, um secret vazio
      # passa despercebido: `import.meta.env` ausente vira undefined e o build
      # sobe normalmente — foi assim que a versao React falhava calada.
      - name: Conferir que as credenciais entraram no bundle
        run: |
          if ! grep -q "$(echo '${{ secrets.FIREBASE_PROJECT_ID }}')" build/web/main.dart.js; then
            echo "::error::FIREBASE_PROJECT_ID não chegou ao bundle. Confira os secrets do repositório."
            exit 1
          fi
          echo "Credenciais presentes no bundle."

  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analise-e-testes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Montar env.json a partir dos secrets
        run: |
          cat > env.json <<'JSON'
          {
            "FIREBASE_API_KEY": "${{ secrets.FIREBASE_API_KEY }}",
            "FIREBASE_APP_ID": "${{ secrets.FIREBASE_APP_ID }}",
            "FIREBASE_MESSAGING_SENDER_ID": "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            "FIREBASE_PROJECT_ID": "${{ secrets.FIREBASE_PROJECT_ID }}",
            "FIREBASE_AUTH_DOMAIN": "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            "FIREBASE_STORAGE_BUCKET": "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          JSON

      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define-from-file=env.json

      # O APK fica anexado a execucao por 14 dias — da para o grupo baixar e
      # instalar no celular sem precisar de ambiente Flutter montado.
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ecomapbrasil-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
